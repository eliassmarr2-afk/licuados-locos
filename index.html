<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ededed">
  <title>Licuados Locos</title>
  <meta name="description" content="Licuados frescos, simples y combinados.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="storefront-shell">
    <header class="catalog-hero">
      <div class="catalog-search-row">
        <label class="catalog-search">
          <input id="searchInput" type="search" placeholder="Buscar licuado" autocomplete="off">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m21 21-4.35-4.35m1.35-5.15a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z"/>
          </svg>
        </label>

        <button class="menu-button" type="button" aria-label="Más opciones">
          <span></span><span></span><span></span>
        </button>
      </div>

      <nav class="fruit-categories" aria-label="Sabores de licuados">
        <button class="fruit-category is-active" type="button" data-filter="todos">
          <span class="fruit-category__icon">🥤</span>
          <span class="fruit-category__label">Todos</span>
        </button>
        <button class="fruit-category" type="button" data-filter="banana">
          <span class="fruit-category__icon">🍌</span>
          <span class="fruit-category__label">Banana</span>
        </button>
        <button class="fruit-category" type="button" data-filter="frutilla">
          <span class="fruit-category__icon">🍓</span>
          <span class="fruit-category__label">Frutilla</span>
        </button>
        <button class="fruit-category" type="button" data-filter="sandia">
          <span class="fruit-category__icon">🍉</span>
          <span class="fruit-category__label">Sandía</span>
        </button>
        <button class="fruit-category" type="button" data-filter="durazno">
          <span class="fruit-category__icon">🍑</span>
          <span class="fruit-category__label">Durazno</span>
        </button>
        <button class="fruit-category" type="button" data-filter="manzana">
          <span class="fruit-category__icon">🍏</span>
          <span class="fruit-category__label">Manzana</span>
        </button>
        <button class="fruit-category" type="button" data-filter="uvas">
          <span class="fruit-category__icon">🍇</span>
          <span class="fruit-category__label">Uvas</span>
        </button>
      </nav>
    </header>

    <section class="ad-slot" aria-label="Espacio publicitario">
      <span>ESPACIO PUBLICITARIO</span>
      <strong>Banner destacado</strong>
    </section>

    <section class="catalog-block" aria-labelledby="classicTitle">
      <div class="catalog-heading">
        <div>
          <span class="catalog-kicker">LICUADOS</span>
          <h1 id="classicTitle">Clásicos</h1>
        </div>
        <span class="catalog-heading__price">$8.890</span>
      </div>
      <div class="product-list" id="classicGrid"></div>
    </section>

    <section class="ad-slot ad-slot--compact" aria-label="Espacio publicitario">
      <span>ESPACIO PUBLICITARIO</span>
      <strong>Banner entre secciones</strong>
    </section>

    <section class="catalog-block" aria-labelledby="comboTitle">
      <div class="catalog-heading">
        <div>
          <span class="catalog-kicker">COMBINADOS</span>
          <h2 id="comboTitle">Mezclas</h2>
        </div>
        <span class="catalog-heading__price">$9.230</span>
      </div>
      <div class="product-list" id="comboGrid"></div>
    </section>

    <p class="empty-state" id="emptyState" hidden>No encontramos licuados con esa búsqueda.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
