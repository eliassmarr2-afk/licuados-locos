<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ededed">
  <title>Producto | Licuados Locos</title>
  <meta name="description" content="Detalle de licuado.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260920-1810">
</head>
<body>
  <main class="product-screen" data-product-page>
    <section class="product-screen__hero">
      <div class="product-screen__topbar">
        <a class="square-control" href="index.html" aria-label="Volver al inicio">‹</a>
        <button class="square-control square-control--menu" type="button" aria-label="Más opciones">
          <span></span><span></span><span></span>
        </button>
      </div>

      <div class="product-screen__visual">
        <img id="productImage" src="" alt="">
      </div>
    </section>

    <section class="product-screen__body">
      <button class="floating-favorite" type="button" aria-label="Agregar a favoritos">♥</button>

      <div class="product-screen__heading">
        <h1 id="productName">Licuado</h1>
        <p id="productSubtitle">Licuado clásico</p>
      </div>

      <div class="product-screen__price-row">
        <strong id="productPrice">$0</strong>

        <div class="quantity-control quantity-control--detail" aria-label="Cantidad">
          <button id="quantityMinus" type="button" aria-label="Restar uno">−</button>
          <span id="quantityValue">1</span>
          <button id="quantityPlus" type="button" aria-label="Sumar uno">+</button>
        </div>
      </div>

      <div class="product-about">
        <h2>Sobre el producto</h2>
        <p id="productDescription"></p>
      </div>

      <button class="add-to-order" type="button">Agregar al pedido</button>
    </section>
  </main>

  <script src="app.js?v=20260920-1810"></script>
</body>
</html>
