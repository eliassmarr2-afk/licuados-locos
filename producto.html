<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ededed">
  <title>Producto | Licuados Locos</title>
  <meta name="description" content="Detalle de licuado.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="product-detail-shell" data-product-page>
    <section class="product-hero">
      <img class="product-hero__image" id="productImage" src="" alt="">
      <div class="product-hero__topbar">
        <a class="hero-button" href="index.html" aria-label="Volver al inicio">‹</a>
        <button class="hero-button" type="button" aria-label="Más opciones">⋮</button>
      </div>
    </section>

    <section class="product-detail-card">
      <button class="product-detail-card__favorite" type="button" aria-label="Agregar a favoritos">♥</button>

      <p class="product-detail__tag" id="productKind">Clásico</p>
      <h1 id="productName">Licuado</h1>
      <p class="product-detail__subtitle" id="productSubtitle">Licuado clásico</p>

      <div class="product-detail__buy-row">
        <strong class="product-detail__price" id="productPrice">$0</strong>
        <div class="quantity-control" aria-label="Cantidad">
          <button id="quantityMinus" type="button" aria-label="Restar uno">−</button>
          <span id="quantityValue">1</span>
          <button id="quantityPlus" type="button" aria-label="Sumar uno">+</button>
        </div>
      </div>

      <div class="product-about">
        <h2>Sobre el producto</h2>
        <p id="productDescription"></p>
      </div>

      <button class="add-to-cart" type="button">Agregar al pedido</button>
      <p class="product-note">
        El color de esta interfaz pertenece al producto y queda listo para ser reemplazado por el valor que entregue Protocol Data.
      </p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
